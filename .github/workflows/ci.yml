name: CI

on:
  push:
  pull_request:

jobs:
  local-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m compileall -q src scripts dags
      - run: ruff check src scripts tests dags
      - run: ruff format --check src scripts tests dags
      - run: python scripts/validate_project.py
      - run: pytest
