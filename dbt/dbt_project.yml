name: retailiq
version: 1.0.0
config-version: 2

profile: retailiq

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
seed-paths: ["seeds"]
snapshot-paths: ["snapshots"]
target-path: "target"
log-path: "logs"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  retailiq:
    +persist_docs:
      relation: true
      columns: true
    staging:
      +schema: STAGING
      +materialized: view
    intermediate:
      +schema: INTERMEDIATE
      +materialized: view
    marts:
      +schema: ANALYTICS
      +materialized: table
      facts:
        +materialized: incremental

